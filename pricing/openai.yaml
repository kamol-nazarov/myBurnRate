# Single pricing authority for OpenAI models: official OpenAI model pages only.
# Long context: 2x input-class pricing above the documented threshold; cache
# writes bill at 1.25x the uncached input rate.
provider: openai
exactness: exact
prices:
  - model_key: gpt-6-astra
    aliases: [opencode:gpt-6-astra]
    # Standard API rates verified 2026-09-04; this is an assertion floor,
    # not a claim about the model's launch date. Processing-tier premiums
    # and discounts are not inferred from missing telemetry.
    input_per_mtok: 10.00
    cached_input_per_mtok: 1.00
    cache_write_per_mtok: 12.50
    output_per_mtok: 50.00
    long_context_threshold: 272000
    long_input_multiplier: 2
    long_output_multiplier: 1.5
    effective_from: 2026-09-04T20:42:18.748000Z
    source_url: https://developers.openai.com/api/docs/models/gpt-6-astra
  - model_key: gpt-6.1-sol
    # Released 2026-09-29. Standard short-context rates apply through 272K
    # input tokens; above that the whole request is 2x input-class and 1.5x
    # output. Batch, Flex, and Fast tiers are not encoded.
    input_per_mtok: 2.00
    cached_input_per_mtok: 0.10
    cache_write_per_mtok: 2.50
    output_per_mtok: 10.00
    long_context_threshold: 272000
    long_input_multiplier: 2
    long_output_multiplier: 1.5
    effective_from: 2026-09-29T00:00:00Z
    source_url: https://developers.openai.com/api/docs/models/gpt-6.1-sol
  - model_key: gpt-6.1-terra
    # Released 2026-10-26; the model page gives no date, so effective_from is
    # the day its rates were verified. Cached input is 5% of input. Cache
    # writes are $1.25 for the standard 30-minute retention ($2.50 for the
    # 12-hour retention, which Codex logs do not distinguish). Above 272K input
    # tokens the whole request is 2x input-class and 1.5x output.
    input_per_mtok: 1.00
    cached_input_per_mtok: 0.05
    cache_write_per_mtok: 1.25
    output_per_mtok: 5.00
    long_context_threshold: 272000
    long_input_multiplier: 2
    long_output_multiplier: 1.5
    effective_from: 2026-10-26T00:00:00Z
    source_url: https://developers.openai.com/api/docs/models/gpt-6.1-terra
  - model_key: gpt-6-sol
    aliases: [opencode:gpt-6-sol]
    # The official changelog dates these base rates to the 2026-09-22 launch:
    # https://developers.openai.com/api/docs/changelog
    # Cached input is $0.20, twice GPT-6.1 Sol's. Above 272K input
    # tokens the whole request is 2x input-class and 1.5x output.
    input_per_mtok: 2.00
    cached_input_per_mtok: 0.20
    cache_write_per_mtok: 2.50
    output_per_mtok: 10.00
    long_context_threshold: 272000
    long_input_multiplier: 2
    long_output_multiplier: 1.5
    effective_from: 2026-09-22T00:00:00Z
    source_url: https://developers.openai.com/api/docs/models/gpt-6-sol
  - model_key: gpt-6-luna
    aliases: [opencode:gpt-6-luna, opencode:openai/gpt-6-luna]
