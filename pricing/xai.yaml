# Derived pricing for xAI models from the official xAI pricing page.
# https://docs.x.ai/developers/pricing
# xAI documents no cache-write fee, so cache writes are not a billed class (0).
# Long-context tiers: "requests whose prompt reaches the listed token threshold
# are billed at the higher rate for all tokens in the request" — the 200k
# threshold is therefore inclusive.
# SuperGrok/Grok Build subscription usage is attributed at these published API
# rates, so it is a derived (approximate) value, never metered billing.
provider: xai
exactness: derived
prices:
  - model_key: xai:grok-4.6
    aliases: [supergrok:grok-4.6, opencode:grok-4.6]
    input_per_mtok: 2.00
    cached_input_per_mtok: 0.50
    cache_write_per_mtok: 0.00
    output_per_mtok: 6.00
    long_context_threshold: 200000
    long_context_inclusive: true
    long_input_multiplier: 2
    long_output_multiplier: 2
    effective_from: 2026-08-12T00:00:00Z
    source_url: https://docs.x.ai/developers/pricing
  - model_key: xai:grok-4.7
    # Verified 2026-10-26; effective_from is that verification floor. Grok
    # Build names this model grok-4.7-build: its per-turn charges
    # (costUsdTicks) reproduce these rates, long-context tier included.
    aliases: [supergrok:grok-4.7, supergrok:grok-4.7-build]
    input_per_mtok: 2.00
    cached_input_per_mtok: 0.50
    cache_write_per_mtok: 0.00
    output_per_mtok: 6.00
    long_context_threshold: 200000
    long_context_inclusive: true
    long_input_multiplier: 2
    long_output_multiplier: 2
    effective_from: 2026-10-26T00:00:00Z
    source_url: https://docs.x.ai/developers/pricing
  - model_key: xai:grok-4.7-fast
    # Grok 4.7 Fast is offered only in Cursor and Grok Build, with no public
    # API model id; Grok Build reports it as grok-4.7-build-fast, and its turn
    # charges reproduce these rates. Above 200k prompt tokens the page lists
    # $6 / $1.50 / $18 (1.5x). Verified 2026-10-26.
    aliases: [supergrok:grok-4.7-build-fast, supergrok:grok-4.7-fast]
    input_per_mtok: 4.00
    cached_input_per_mtok: 1.00
    cache_write_per_mtok: 0.00
    output_per_mtok: 12.00
    long_context_threshold: 200000
    long_context_inclusive: true
    long_input_multiplier: 1.5
    long_output_multiplier: 1.5
    effective_from: 2026-10-26T00:00:00Z
    source_url: https://docs.x.ai/developers/pricing
