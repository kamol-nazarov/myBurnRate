# Derived pricing for OpenCode Go models from the official OpenCode Go page.
# https://opencode.ai/docs/go/
#
# Go and Go Plus bill every request in dollars at these per-token rates against
# 5-hour, weekly and monthly allowances. A cached write of "-" is not a billed
# class (0). OpenCode reports reasoning separately from output; the OpenCode
# reader adds it to output, which is how the recorded Go cost reproduces.
#
# DeepSeek V4.1 Flash and V4 Pro bill double during peak hours (01:00-04:00 and
# 06:00-10:00 UTC, Monday to Friday). A card cannot vary by hour of day, so
# they use the off-peak rates that apply to every other hour.
#
# effective_from is the date this table was read from the official page; Go
# usage before it stays unpriced rather than back-dated.
