[package]
name = "burnrate-desktop"
version = "0.4.0-beta.1"
description = "BURNRATE Native Desktop App & Always-on-Top Multi-Computer Sidecar HUD"
authors = ["BURNRATE contributors"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "burnrate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
