[package]
name = "burnrate-desktop"
version = "0.5.3"
description = "BURNRATE Native Desktop App & Always-on-Top Multi-Computer Sidecar HUD"
authors = ["BURNRATE contributors"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "burnrate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol serves the bundled pages (the starting page) in every build,
# not only those made by the Tauri CLI. macos-private-api: the transparent
# glass HUD window on macOS.
tauri = { version = "2", features = ["tray-icon", "custom-protocol", "macos-private-api"] }
auto-launch = "0.6"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Loopback supervisor probes need a total HTTP/body deadline, without proxying
# or following redirects. Reuses the updater's existing reqwest version.
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
# The updater enables rustls without choosing its provider until its first
# request. Supervisor HTTP client construction happens earlier; use the same
# already-bundled ring provider without adding a second TLS implementation.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
