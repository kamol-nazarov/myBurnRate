name: Prices

# Weekly: report rate cards that need a person's attention (ending windows,
# OpenRouter prices that moved) as a single open issue. Never edits a card.

"on":
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the rate cards
        run: |
          python -m pip install --quiet pyyaml httpx
          python scripts/check_prices.py > price-report.md
          cat price-report.md
      - name: File or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Rate cards need review"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ ! -s price-report.md ]; then
            echo "Nothing to review."
            exit 0
          fi
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file price-report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file price-report.md
          fi
