name: Desktop

# Builds the frozen service and the desktop bundle on each platform and
# smoke-tests them. Release builds (release.yml) add update signing and
# Windows code signing; these do not, so pull requests from forks work too.

"on":
  push:
    branches: [main, "release/**", "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  bundle:
    name: bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
          - name: macos
            os: macos-latest
            bundles: app,dmg
          - name: linux
            os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install pinned Tauri CLI
        run: npm ci --prefix tools/tauri --no-audit --no-fund

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 2026-11-14

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev xvfb libfuse2

      - name: Build the frozen service
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python packaging/build_service.py

      - name: Smoke-test the frozen service
        run: ./.github/scripts/smoke-service.ps1

      - name: Build the desktop bundle
        run: npm exec --prefix tools/tauri -- tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.ci.conf.json

      - name: Smoke-test the Windows installer
        if: runner.os == 'Windows'
        run: ./.github/scripts/smoke-installer.ps1

      - name: Smoke-test the desktop app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export BURNRATE_UPDATES=0 BURNRATE_DATA_ROOT="$(mktemp -d)"
          app="$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)"
          "$app/Contents/MacOS/burnrate-desktop" &
          for i in $(seq 1 180); do curl -sf http://127.0.0.1:17331/healthz && break; sleep 0.5; done
          curl -sf http://127.0.0.1:17331/healthz
          curl -sf -o hud.html http://127.0.0.1:17331/hud && grep -q "Sidecar HUD" hud.html
          kill %1 || true

      - name: Smoke-test the desktop app (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export BURNRATE_UPDATES=0 BURNRATE_DATA_ROOT="$(mktemp -d)"
          appimage="$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)"
          chmod +x "$appimage"
          xvfb-run -a "$appimage" &
          for i in $(seq 1 180); do curl -sf http://127.0.0.1:17331/healthz && break; sleep 0.5; done
          curl -sf http://127.0.0.1:17331/healthz || { tail -n 60 "$BURNRATE_DATA_ROOT"/logs/*.log 2>/dev/null; exit 1; }
          curl -sf -o hud.html http://127.0.0.1:17331/hud && grep -q "Sidecar HUD" hud.html
          kill %1 || true

      - name: Upload the bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.name }}
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
