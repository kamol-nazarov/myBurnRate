name: CI

"on":
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Intentionally empty of provider keys. Do not add OPENAI_ADMIN_KEY,
# ANTHROPIC_ADMIN_KEY, CURSOR_API_KEY, OPENROUTER_MANAGEMENT_KEY,
# SPEND_REAL_DB_COPY, or BURNRATE_CLAUDE_OAUTH_REFRESH.
env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

defaults:
  run:
    shell: pwsh

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Refuse provider credentials
        run: ./.github/scripts/assert-no-provider-env.ps1

      - name: Install Python dependencies
        run: ./.github/scripts/install-python-ci.ps1

      - name: Run pytest (synthetic fixtures; skip live DB and Chrome)
        run: |
          python -m pytest tests_spend -q `
            --ignore=tests_spend/test_s01_real_db.py `
            --ignore=tests_spend/test_s02_real_db.py `
            --ignore=tests_spend/test_s03_real_db.py `
            -m "not real_db and not browser"

  lint:
    name: Python correctness and product lint
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Refuse provider credentials
        run: ./.github/scripts/assert-no-provider-env.ps1

      - name: Required Python correctness checks
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m compileall -q spend_app tests_spend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Required across the entire tree, independent of dependency syntax.
          # Broader lint/format rules remain mandatory for product modules below.
          python -m ruff check --select E9,F63,F7,F82 spend_app tests_spend
          exit $LASTEXITCODE

      - name: Lint new product modules and release helpers
        run: |
          python -m ruff check spend_app/plan_service.py spend_app/product_api.py spend_app/subscription_schema.py spend_app/diagnostics.py tests_spend/test_plan_management.py tests_spend/test_onboarding.py scripts/validate-browser.py scripts/smoke-install.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format --check spend_app/plan_service.py spend_app/product_api.py spend_app/subscription_schema.py spend_app/diagnostics.py tests_spend/test_plan_management.py tests_spend/test_onboarding.py scripts/validate-browser.py scripts/smoke-install.py

  supply-chain:
    name: supply chain (lock, npm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Lockfile and hash-locked exports are current
        run: |
          python -m pip install uv==0.11.30
          uv lock --check
          uv export --frozen --no-dev --extra build --no-emit-project --format requirements.txt -o requirements-build.txt
          uv export --frozen --no-dev --no-emit-project --format requirements.txt -o requirements-runtime.txt
          uv export --frozen --extra dev --no-emit-project --format requirements.txt -o requirements-dev.txt
          uv export --frozen --extra dev --extra build --no-emit-project --format requirements.txt -o requirements-ci.txt
          git diff --exit-code -- requirements-build.txt requirements-runtime.txt requirements-dev.txt requirements-ci.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: npm audit (updater signer CLI)
        run: |
          npm audit --prefix tools/tauri --audit-level=high

  pip-audit:
    name: pip-audit
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Refuse provider credentials
        run: ./.github/scripts/assert-no-provider-env.ps1

      - name: Install Python dependencies
        run: ./.github/scripts/install-python-ci.ps1

      - name: Audit installed packages
        run: python -m pip_audit

  frontend:
    name: frontend
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Refuse provider credentials
        run: ./.github/scripts/assert-no-provider-env.ps1

      - name: Install Python dependencies
        run: ./.github/scripts/install-python-ci.ps1

      - name: Desktop UI and API contract tests
        run: |
          python -m pytest -q `
            tests_spend/test_build_prompt_api_contract.py `
            tests_spend/test_build_prompt_consistency.py `
            tests_spend/test_build_prompt_null_zero_approx.py `
            tests_spend/test_build_prompt_quota_activity.py `
            tests_spend/test_performance_phase3.py

      - name: Required browser validation (desktop UI)
        run: python scripts/validate-browser.py

      - name: Upload sanitized browser report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: required-browser-results
          path: test-results/required-browser.xml

  package-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python scripts/smoke-install.py

  secret-scan:
    name: secret-scan
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Refuse provider credentials
        run: ./.github/scripts/assert-no-provider-env.ps1

      - name: Python redacted scan
        run: python .github/scripts/redacted_secret_scan.py .

      - name: Gitleaks Action
        id: gitleaks_action
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Gitleaks snapshot and Git fallback
        env:
          ACTION_OUTCOME: ${{ steps.gitleaks_action.outcome }}
        run: |
          $ver = "8.30.1"
          $zip = Join-Path $env:RUNNER_TEMP "gitleaks.zip"
          $dir = Join-Path $env:RUNNER_TEMP "gitleaks"
          $url = "https://github.com/gitleaks/gitleaks/releases/download/v$ver/gitleaks_${ver}_windows_x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $expected = "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e"
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash -ne $expected) {
            throw "Gitleaks archive SHA-256 did not match the pinned release"
          }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Join-Path $dir "gitleaks.exe"
          & $exe dir . --config .github/gitleaks.toml --redact=100 --no-banner --exit-code 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:ACTION_OUTCOME -ne 'success') {
            & $exe git . --config .github/gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact=100 --no-banner --exit-code 1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
