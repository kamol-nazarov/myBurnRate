name: CI

"on":
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Intentionally empty of provider keys. Do not add OPENAI_ADMIN_KEY,
# ANTHROPIC_ADMIN_KEY, CURSOR_API_KEY, OPENROUTER_MANAGEMENT_KEY,
# SPEND_REAL_DB_COPY, or BURNRATE_CLAUDE_OAUTH_REFRESH.
env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

defaults:
  run:
    shell: pwsh

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Refuse provider credentials
        run: ./.github/scripts/assert-no-provider-env.ps1

      - name: Install Python dependencies
        run: ./.github/scripts/install-python-ci.ps1

      - name: Run pytest (synthetic fixtures; skip live DB and Chrome)
        run: |
          python -m pytest tests_spend -q `
            --ignore=tests_spend/test_s01_real_db.py `
            --ignore=tests_spend/test_s02_real_db.py `
            --ignore=tests_spend/test_s03_real_db.py `
            --ignore=tests_spend/test_frontend_viewports.py `
            --ignore=tests_spend/test_performance_phase2.py `
            -m "not real_db and not browser"

  native-tests:
    name: Native supervisor regressions
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 2026-11-14
      - name: Test owned-process supervision
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib supervisor_tests

  lint:
    name: Python correctness and product lint
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Refuse provider credentials
        run: ./.github/scripts/assert-no-provider-env.ps1

      - name: Required Python correctness checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m compileall -q spend_app tests_spend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Required across the entire tree, independent of dependency syntax.
          # Broader lint/format rules remain mandatory for product modules below.
          python -m ruff check --select E9,F63,F7,F82 spend_app tests_spend
          exit $LASTEXITCODE

      - name: Lint new product modules and release helpers
        run: |
          python -m ruff check spend_app/plan_service.py spend_app/product_api.py spend_app/subscription_schema.py spend_app/diagnostics.py tests_spend/test_plan_management.py tests_spend/test_onboarding.py tests_spend/test_product_browser_plans.py tests_spend/test_product_browser_setup.py scripts/validate-browser.py scripts/smoke-install.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format --check spend_app/plan_service.py spend_app/product_api.py spend_app/subscription_schema.py spend_app/diagnostics.py tests_spend/test_plan_management.py tests_spend/test_onboarding.py tests_spend/test_product_browser_plans.py tests_spend/test_product_browser_setup.py scripts/validate-browser.py scripts/smoke-install.py

  supply-chain:
    name: supply chain (lock, Rust, npm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Lockfile and hash-locked exports are current
        run: |
          python -m pip install uv==0.11.30
          uv lock --check
          uv export --frozen --no-dev --extra build --no-emit-project --format requirements.txt -o requirements-build.txt
          uv export --frozen --extra dev --no-emit-project --format requirements.txt -o requirements-dev.txt
          uv export --frozen --extra dev --extra build --no-emit-project --format requirements.txt -o requirements-ci.txt
          git diff --exit-code -- requirements-build.txt requirements-dev.txt requirements-ci.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: npm audit (asset tooling and Tauri CLI)
        run: |
          npm audit --prefix scripts/asset-tools --audit-level=high
          npm audit --prefix tools/tauri --audit-level=high
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 2026-11-14
      - name: Rust advisory audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock

  pip-audit:
    name: pip-audit
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Refuse provider credentials
        run: ./.github/scripts/assert-no-provider-env.ps1

      - name: Install Python dependencies
        run: ./.github/scripts/install-python-ci.ps1

      - name: Audit installed packages
        run: python -m pip_audit

  frontend:
    name: frontend
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Refuse provider credentials
        run: ./.github/scripts/assert-no-provider-env.ps1

      - name: Install Python dependencies
        run: ./.github/scripts/install-python-ci.ps1

      - name: node --check (skip if node missing)
        run: |
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
            Write-Host "node not available; skipping node --check"
            exit 0
          }
          $scripts = Get-ChildItem -Path spend_web -Filter *.js -File -Recurse -ErrorAction SilentlyContinue
          if (-not $scripts) {
            Write-Host "no spend_web/*.js files"
            exit 0
          }
          foreach ($script in $scripts) {
            Write-Host "node --check $($script.FullName)"
            node --check $script.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Dialog unit and fake-DOM contracts
        run: |
          node tests_spend/connections_state_unit.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests_spend/product_dialog_unit.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests_spend/product_dialog_flow_unit.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests_spend/test_plans_value_ui.cjs
          exit $LASTEXITCODE

      - name: Frontend contract tests
        run: |
          python -m pytest -q `
            tests_spend/test_frontend_contract.py `
            tests_spend/test_frontend_states.py `
            tests_spend/test_navbar.py `
            tests_spend/test_capacity_strip.py `
            tests_spend/test_chart_polish.py `
            tests_spend/test_build_prompt_api_contract.py `
            tests_spend/test_build_prompt_consistency.py `
            tests_spend/test_build_prompt_motion.py `
            tests_spend/test_build_prompt_responsive.py `
            tests_spend/test_build_prompt_null_zero_approx.py `
            tests_spend/test_build_prompt_quota_activity.py `
            tests_spend/test_performance_phase1.py `
            tests_spend/test_performance_phase3.py `
            tests_spend/test_performance_phase4.py `
            tests_spend/test_performance_phase5.py

      - name: Required browser validation (including request races)
        run: python scripts/validate-browser.py

      - name: Upload sanitized browser report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: required-browser-results
          path: test-results/required-browser.xml

  package-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python scripts/smoke-install.py

  secret-scan:
    name: secret-scan
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Refuse provider credentials
        run: ./.github/scripts/assert-no-provider-env.ps1

      - name: Python redacted scan
        run: python .github/scripts/redacted_secret_scan.py .

      - name: Gitleaks Action
        id: gitleaks_action
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Gitleaks CLI fallback
        if: steps.gitleaks_action.outcome != 'success'
        run: |
          $ver = "8.30.1"
          $zip = Join-Path $env:RUNNER_TEMP "gitleaks.zip"
          $dir = Join-Path $env:RUNNER_TEMP "gitleaks"
          $url = "https://github.com/gitleaks/gitleaks/releases/download/v$ver/gitleaks_${ver}_windows_x64.zip"
          Write-Host "gitleaks-action did not succeed; running CLI $ver"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Join-Path $dir "gitleaks.exe"
          & $exe detect --source . --config .github/gitleaks.toml --redact --no-banner --exit-code 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
