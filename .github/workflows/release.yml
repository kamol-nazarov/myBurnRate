name: Release

# Builds a release from a version tag entirely on GitHub, so every download is
# traceable to this workflow and the tagged commit:
#   1. the native Windows app (myBurnRate): installer, optional SignPath
#      Authenticode signing, minisign update signature, and native-latest.json;
#   2. wheel, sdist, icon.ico, SHA256SUMS and build provenance; then a DRAFT
#      GitHub Release. Publishing the draft is a person's decision.
#
# Tag with `git tag -a v0.4.0-beta.2 -m "BURNRATE v0.4.0-beta.2"` and push it.

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.4.0-beta.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  check:
    name: check the tag matches the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Security regressions before release bundles
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pytest tests_spend/test_security_runtime.py -q
      - id: version
        shell: python
        run: |
          import os, re
          tag = os.environ["TAG"]
          version = tag.removeprefix("v")
          package = re.search(r'__version__ = "([^"]+)"', open("spend_app/__init__.py", encoding="utf-8").read()).group(1)
          assert version == package, f"tag {tag}, spend_app {package}"
          assert os.path.isfile(f"docs/releases/RELEASE-{version}.md"), f"missing docs/releases/RELEASE-{version}.md"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")

  native-windows:
    name: native Windows app (installer, signing, update feed)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.check.outputs.version }}
      INSTALLER: myBurnRate_${{ needs.check.outputs.version }}_x64-setup.exe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Install pinned updater signer CLI
        run: npm ci --prefix tools/tauri --no-audit --no-fund
      - name: Build the native app and its installer (unsigned)
        env:
          BURNRATE_BUILTIN_HUB_URL: ${{ secrets.BURNRATE_BUILTIN_HUB_URL }}
        run: |
          if (-not $env:BURNRATE_BUILTIN_HUB_URL) { throw "Set the BURNRATE_BUILTIN_HUB_URL repository secret" }
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install --no-deps --no-build-isolation -e .
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          python packaging/build_native.py --require-installer
      - name: Smoke-test the frozen native app
        run: |
          $app = Join-Path $PWD 'packaging/build/native/BURNRATE/BURNRATE.exe'
          $process = Start-Process -FilePath $app -ArgumentList @('--demo', '--smoke-test') -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Native sample-data smoke test timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Native smoke test failed: $($process.ExitCode)" }
      - name: Keep only the installer for signing
        run: |
          New-Item -ItemType Directory -Force to-sign | Out-Null
          Copy-Item "packaging/build/$env:INSTALLER" to-sign/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: unsigned
        with:
          name: native-windows-unsigned-installer
          path: to-sign/*
          if-no-files-found: error
      # Each signing request waits for an approver in SignPath (SignPath Foundation's rules).
      # Without SIGNPATH_ORGANIZATION_ID the installer ships unsigned.
      - uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3000
          output-artifact-directory: signed
      - name: Choose the final installer
        run: |
          New-Item -ItemType Directory -Force native-release | Out-Null
          $signed = Join-Path 'signed' $env:INSTALLER
          if (Test-Path $signed) {
            if ((Get-AuthenticodeSignature $signed).Status -ne 'Valid') { throw "SignPath returned an installer without a valid signature" }
            Copy-Item $signed native-release/
          } else {
            Write-Host "Authenticode: no SignPath signature, so this installer is UNSIGNED."
            Copy-Item "packaging/build/$env:INSTALLER" native-release/
          }
      # The update signature covers the FINAL bytes, so it is made after SignPath. `tauri signer
      # sign` records the file's basename in the signed trusted comment, and the app refuses a
      # signature whose `file:` is not exactly myBurnRate_<version>_x64-setup.exe: sign it
      # under that name, in that folder, and do not rename it afterwards.
      - name: Make the update signature for the final installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm exec --prefix tools/tauri -- tauri signer sign "native-release/$env:INSTALLER"
      # Decode the .sig, require its signed file: field to equal the installer's name, and verify
      # it against the key pinned in the app, exactly as an installed copy will.
      - name: Check the update signature names this file and verifies
        run: python packaging/verify_native_release.py "native-release/$env:INSTALLER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-windows
          path: native-release/*
          if-no-files-found: error

  publish:
    name: draft the GitHub release
    needs: [check, native-windows]
    if: always() && needs.native-windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Wheel and sdist
        env:
          BURNRATE_BUILTIN_HUB_URL: ${{ secrets.BURNRATE_BUILTIN_HUB_URL }}
        run: |
          test -n "$BURNRATE_BUILTIN_HUB_URL" || { echo "::error::Set the BURNRATE_BUILTIN_HUB_URL repository secret"; exit 1; }
          python -m pip install --require-hashes -r requirements-build.txt
          python -m build --no-isolation --outdir release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-windows
          path: native
      - name: Gather files
        run: |
          cp native/* release/
          cp assets/icons/icon.ico release/
          python packaging/make_latest_json.py --native --tag "$TAG" --repo "$GITHUB_REPOSITORY" --dir release
          (cd release && sha256sum * > SHA256SUMS)
          ls -la release
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/*
      - name: Create the draft release
        run: |
          gh release create "$TAG" release/* \
            --draft --verify-tag \
            --title "BURNRATE v$VERSION" \
            --notes-file "docs/releases/RELEASE-$VERSION.md"
