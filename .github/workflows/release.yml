name: Release

# Builds a release from a version tag entirely on GitHub, so every download is
# traceable to this workflow and the tagged commit:
#   1. bundles for Windows, macOS (Apple silicon) and Linux, update-signed;
#   2. Windows code signing through SignPath, when it is configured;
#   3. the native Windows app: installer, optional Authenticode signing, its own
#      update signature and the native-latest.json feed (separate from latest.json);
#   4. latest.json (the Tauri in-app update feed), wheel, sdist, SHA256SUMS and
#      build provenance; then a DRAFT GitHub Release. Publishing the draft is
#      a person's decision.
#
# Tag with `git tag -a v0.4.0-beta.2 -m "BURNRATE v0.4.0-beta.2"` and push it.

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.4.0-beta.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  check:
    name: check the tag matches the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Security regressions before release bundles
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pytest tests_spend/test_security_runtime.py -q
      - id: version
        shell: python
        run: |
          import json, os, re, tomllib
          tag = os.environ["TAG"]
          version = tag.removeprefix("v")
          tauri = json.load(open("src-tauri/tauri.conf.json", encoding="utf-8"))["version"]
          package = re.search(r'__version__ = "([^"]+)"', open("spend_app/__init__.py", encoding="utf-8").read()).group(1)
          assert tauri == version == package, f"tag {tag}, tauri {tauri}, spend_app {package}"
          assert os.path.isfile(f"docs/releases/RELEASE-{version}.md"), f"missing docs/releases/RELEASE-{version}.md"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")

  bundle:
    name: bundle (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
          - name: macos
            os: macos-latest
            bundles: app,dmg
          - name: linux
            os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install pinned Tauri CLI
        run: npm ci --prefix tools/tauri --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 2026-11-14
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Build the frozen service
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python packaging/build_service.py
      - name: Smoke-test the frozen service
        run: ./.github/scripts/smoke-service.ps1
      - name: Build the update-signed desktop bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm exec --prefix tools/tauri -- tauri build --bundles ${{ matrix.bundles }}
      - name: Collect release files
        run: |
          $out = New-Item -ItemType Directory -Force dist
          $bundle = "src-tauri/target/release/bundle"
          $patterns = @("nsis/*-setup.exe", "nsis/*-setup.exe.sig", "dmg/*.dmg", "appimage/*.AppImage",
                        "appimage/*.AppImage.sig", "deb/*.deb")
          foreach ($pattern in $patterns) {
            Get-ChildItem (Join-Path $bundle $pattern) -ErrorAction SilentlyContinue | Copy-Item -Destination $out
          }
          # macOS's update bundle is named after the app alone; give it the version and architecture.
          foreach ($archive in Get-ChildItem "$bundle/macos/*.app.tar.gz*" -ErrorAction SilentlyContinue) {
            $name = $archive.Name -replace '^BURNRATE\.app\.tar\.gz', "BURNRATE_${env:VERSION}_aarch64.app.tar.gz"
            Copy-Item $archive.FullName (Join-Path $out $name)
          }
          Get-ChildItem $out | Format-Table Name, Length
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: bundle-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  native-windows:
    name: native Windows app (installer, signing, update feed)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.check.outputs.version }}
      INSTALLER: myBurnRate_${{ needs.check.outputs.version }}_x64-setup.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install pinned Tauri CLI
        run: npm ci --prefix tools/tauri --no-audit --no-fund
      - name: Build the native app and its installer (unsigned)
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install --no-deps --no-build-isolation -e .
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          python packaging/build_native.py --require-installer
      - name: Smoke-test the frozen native app
        run: |
          $app = Join-Path $PWD 'packaging/build/native/BURNRATE/BURNRATE.exe'
          $process = Start-Process -FilePath $app -ArgumentList @('--demo', '--smoke-test') -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Native sample-data smoke test timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Native smoke test failed: $($process.ExitCode)" }
      - name: Keep only the installer for signing
        run: |
          New-Item -ItemType Directory -Force to-sign | Out-Null
          Copy-Item "packaging/build/$env:INSTALLER" to-sign/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: unsigned
        with:
          name: native-windows-unsigned-installer
          path: to-sign/*
          if-no-files-found: error
      # Same SignPath project and the same if-pattern as the Tauri installer. Each request waits
      # for an approver. Without SIGNPATH_ORGANIZATION_ID the installer ships unsigned.
      - uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3000
          output-artifact-directory: signed
      - name: Choose the final installer
        run: |
          New-Item -ItemType Directory -Force native-release | Out-Null
          $signed = Join-Path 'signed' $env:INSTALLER
          if (Test-Path $signed) {
            if ((Get-AuthenticodeSignature $signed).Status -ne 'Valid') { throw "SignPath returned an installer without a valid signature" }
            Copy-Item $signed native-release/
          } else {
            Write-Host "Authenticode: no SignPath signature, so this installer is UNSIGNED."
            Copy-Item "packaging/build/$env:INSTALLER" native-release/
          }
      # The update signature covers the FINAL bytes, so it is made after SignPath. `tauri signer
      # sign` records the file's basename in the signed trusted comment, and the app refuses a
      # signature whose `file:` is not exactly myBurnRate_<version>_x64-setup.exe: sign it
      # under that name, in that folder, and do not rename it afterwards.
      - name: Make the update signature for the final installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm exec --prefix tools/tauri -- tauri signer sign "native-release/$env:INSTALLER"
      # Decode the .sig, require its signed file: field to equal the installer's name, and verify
      # it against the key pinned in the app, exactly as an installed copy will.
      - name: Check the update signature names this file and verifies
        run: python packaging/verify_native_release.py "native-release/$env:INSTALLER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-windows
          path: native-release/*
          if-no-files-found: error

  sign-windows:
    name: code-sign Windows (SignPath)
    needs: [check, bundle]
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundle-windows
          path: unsigned
      - name: Keep only the installer for signing
        run: |
          New-Item -ItemType Directory -Force to-sign | Out-Null
          Copy-Item unsigned/*-setup.exe to-sign/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: unsigned
        with:
          name: windows-unsigned-installer
          path: to-sign/*
          if-no-files-found: error
      # Each signing request waits for an approver in SignPath (SignPath
      # Foundation's rules), then the signed installer comes back here.
      - uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3000
          output-artifact-directory: signed
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install pinned Tauri CLI
        run: npm ci --prefix tools/tauri --no-audit --no-fund
      # The update signature covers the installer's bytes, so it is made again for the signed file.
      - name: Re-sign the signed installer for updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $installer = Get-ChildItem signed/*-setup.exe | Select-Object -First 1
          if ((Get-AuthenticodeSignature $installer.FullName).Status -ne 'Valid') { throw "SignPath returned an unsigned installer" }
          npm exec --prefix tools/tauri -- tauri signer sign $installer.FullName
          Copy-Item signed/* unsigned/ -Force
          Get-ChildItem unsigned | Format-Table Name, Length
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-windows-signed
          path: unsigned/*
          if-no-files-found: error

  publish:
    name: draft the GitHub release
    needs: [check, bundle, sign-windows, native-windows]
    if: always() && needs.bundle.result == 'success' && needs.native-windows.result == 'success' && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Wheel and sdist
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m build --no-isolation --outdir release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bundle-*
          path: bundles
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-windows
          path: native
      - name: Gather files (signed Windows installer when there is one)
        run: |
          windows=bundles/bundle-windows
          if [ -d bundles/bundle-windows-signed ]; then windows=bundles/bundle-windows-signed; fi
          cp "$windows"/* release/
          cp bundles/bundle-macos/* bundles/bundle-linux/* release/
          cp src-tauri/icons/icon.ico release/
          # The native installer and its .sig sit beside the Tauri files, but latest.json and the
          # Scoop/winget manifests ignore myBurnRate_* (they belong to the Tauri updater).
          cp native/* release/
          python packaging/make_latest_json.py --tag "$TAG" --repo "$GITHUB_REPOSITORY" --dir release
          python packaging/make_latest_json.py --native --tag "$TAG" --repo "$GITHUB_REPOSITORY" --dir release
          python packaging/render_manifests.py --tag "$TAG" --repo "$GITHUB_REPOSITORY" --dir release
          (cd release && sha256sum * > SHA256SUMS)
          ls -la release
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/*
      - name: Create the draft release
        run: |
          gh release create "$TAG" release/* \
            --draft --verify-tag \
            --title "BURNRATE v$VERSION" \
            --notes-file "docs/releases/RELEASE-$VERSION.md"
