# BURNRATE gitleaks config.
# Keep any test exceptions scoped to their exact synthetic fixtures.
title = "BURNRATE"

[extend]
useDefault = true

[[rules]]
id = "burnrate-minisign-secret-key"
description = "Minisign encrypted secret key file"
regex = '''(?i)^untrusted comment: minisign encrypted secret key'''
keywords = ["minisign"]

[[rules]]
id = "burnrate-tailscale-key"
description = "Tailscale credential"
regex = '''\btskey-[a-z]+-[A-Za-z0-9_-]{12,}\b'''
keywords = ["tskey-"]

[[rules]]
id = "burnrate-google-api-key"
description = "Google API key"
regex = '''\bAIza[A-Za-z0-9_-]{35}\b'''
keywords = ["AIza"]

[[allowlists]]
description = "Settings-store key name in capacity_forecast.py (not a credential)"
paths = [
    '''(^|/)spend_app/capacity_forecast\.py$''',
]
regexTarget = "line"
regexes = [
    '''^KEY = "capacity_forecast\.v1"$''',
]

[[allowlists]]
description = "Public Claude Code OAuth client id assignment in history (not an access token)"
paths = [
    '''(^|/)spend_app/limits\.py$''',
]
regexTarget = "line"
regexes = [
    '''CLAUDE_OAUTH_CLIENT_ID\s*=''',
]

[[allowlists]]
description = "Reviewed public pricing identifier or synthetic fixture in pricing/anthropic.yaml"
condition = "AND"
regexTarget = "line"
paths = ["(^|/)pricing/anthropic\\.yaml$"]
regexes = ["^\\ \\ \\-\\ model_key:\\ claude\\-mythos\\-5$", "^\\ \\ \\-\\ model_key:\\ claude\\-mythos\\-5\\-1$", "^\\ \\ \\-\\ model_key:\\ claude\\-mythos\\-5\\-2$"]

[[allowlists]]
description = "Reviewed public pricing identifier or synthetic fixture in pricing/openai.yaml"
condition = "AND"
regexTarget = "line"
paths = ["(^|/)pricing/openai\\.yaml$"]
regexes = ["^\\ \\ \\-\\ model_key:\\ gpt\\-6\\-rosalind$"]

[[allowlists]]
description = "Reviewed public pricing identifier or synthetic fixture in tests_spend/fixtures/attention_response.json"
condition = "AND"
regexTarget = "line"
paths = ["(^|/)tests_spend/fixtures/attention_response\\.json$"]
regexes = ["^\\ \\ \\ \\ \\ \\ \"key\":\\ \"3cb4a3cf0811147b3dc225f5cce109cb\",$", "^\\ \\ \\ \\ \\ \\ \"key\":\\ \"8c0ccd6a4c83101ecc9267a9d78f4d6a\",$"]

