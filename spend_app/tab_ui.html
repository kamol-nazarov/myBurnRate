<!doctype html>
<html lang="en" data-theme-pref="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>BURNRATE tab</title>
<script>
/* Same theme scheme as the full window: the host stamps the saved preference
   on <html>; "system" follows the OS; every payload then pins the app's
   effective theme so the tab can never disagree with the main window. */
(function () {
  var root = document.documentElement;
  var query = null;
  try { query = window.matchMedia("(prefers-color-scheme: dark)"); } catch (e) {}
  function resolve(pref) {
    if (pref === "dark" || pref === "light") return pref;
    return query && query.matches ? "dark" : "light";
  }
  function apply(pref) { root.dataset.theme = resolve(pref); }
  window.burnrateTabTheme = { setDark: function (dark) { root.dataset.theme = dark ? "dark" : "light"; } };
  apply(root.dataset.themePref);
  if (query) {
    var follow = function () { if ((root.dataset.themePref || "system") === "system") apply("system"); };
    if (query.addEventListener) query.addEventListener("change", follow);
    else if (query.addListener) query.addListener(follow);
  }
})();
</script>
<style>
/*__EMBEDDED_FONTS__*/
:root {
  color-scheme: light;
  --font: "Manrope", -apple-system, "Segoe UI Variable Text", system-ui, sans-serif;
  --spring: cubic-bezier(0.22, 1, 0.36, 1);
  --surface: #ffffff;
  --card: #f7f7fc;
  --ink: #18172b;
  --muted: #5b5a72;
  --line: rgba(24, 23, 43, 0.10);
  --hover: rgba(24, 23, 43, 0.06);
  --track: rgba(24, 23, 43, 0.12);
  --spend-bg: #f1f1f8;
  --more-bg: #e4f6ee;
  --more-ink: #0d664b;
  --soon: #c42334;
  --warn: #9a4008;
  --ok: #463db8;
  --bal: #0f6f52;
  --chip-bg: #fdecee;
  --chip-ink: #a3202f;
  --badge-ink: #ffffff;
  --brand: #564ed1;
}
html[data-theme="dark"] {
  color-scheme: dark;
  --surface: #18172b;
  --card: #201f36;
  --ink: #ffffff;
  --muted: #b6b5cc;
  --line: rgba(255, 255, 255, 0.10);
  --hover: rgba(255, 255, 255, 0.08);
  --track: rgba(255, 255, 255, 0.16);
  --spend-bg: rgba(255, 255, 255, 0.08);
  --more-bg: rgba(92, 229, 171, 0.16);
  --more-ink: #7ff0bf;
  --soon: #ff7381;
  --warn: #f6ad33;
  --ok: #a39dff;
  --bal: #5ce5ab;
  --chip-bg: rgba(255, 115, 129, 0.16);
  --chip-ink: #ffc0c7;
  --badge-ink: #18172b;
  --brand: #635be0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  overflow: hidden;
  background: transparent;
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
  user-select: none;
  cursor: default;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
button:focus-visible { outline: 2px solid var(--ok); outline-offset: -2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

body { display: flex; flex-direction: column; align-items: flex-start; }
body.up { flex-direction: column-reverse; }

/* ---- Option 4B ultra-compact corner pill (40px capsule) --------------- */
.tab {
  height: 40px;
  flex: none;
  display: flex;
  align-items: center;
  padding: 0 5px;
  border-radius: 20px;
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--line);
  overflow: hidden;
}
.home {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  width: 29px;
  height: 32px;
  margin-right: 2px;
  padding-left: 1px;
  flex: none;
  cursor: grab;
  border-radius: 999px;
}
.brand {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 999px;
  background: var(--brand);
  color: #ffffff;
  flex: none;
  transition: transform 200ms var(--spring);
}
.brand svg { transition: transform 200ms var(--spring); }
.home:hover .brand { transform: scale(1.07); }
.home:hover .brand svg { transform: translate(0.5px, -0.5px) !important; }
.home:active .brand { transform: scale(0.94); }
.badge {
  position: absolute;
  top: 0;
  right: 0;
  min-width: 12px;
  height: 12px;
  padding: 0 2.5px;
  border-radius: 999px;
  background: var(--soon);
  color: var(--badge-ink);
  font-size: 8.5px;
  font-weight: 800;
  line-height: 1;
  display: grid;
  place-items: center;
  border: 1.5px solid var(--surface);
  box-sizing: content-box;
  transition: transform 200ms var(--spring);
}

.pill-main {
  display: flex;
  align-items: center;
  flex: none;
  height: 32px;
  border-radius: 999px;
  min-width: 0;
  transition: background-color 160ms ease, transform 150ms var(--spring);
}
.pill-main:hover, .pill-main.on { background: var(--hover); }
.pill-main:active { transform: scale(0.985); }

.spend {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 26px;
  margin-right: 4px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--spend-bg);
  color: var(--ink);
  font-size: 12.5px;
  font-weight: 800;
  letter-spacing: -0.02em;
  white-space: nowrap;
  overflow: hidden;
  transition: background-color 160ms ease, color 160ms ease;
}
.sep {
  flex: none;
  width: 1px;
  height: 16px;
  margin-right: 5px;
  background: var(--line);
}

.primary {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 28px;
  padding: 0 4px;
  border-radius: 999px;
  min-width: 0;
  overflow: hidden;
}
.logo {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.logo svg { width: 11px; height: 11px; display: block; }
.brand-chip { background: var(--bl-bg); color: var(--bl-fg); border: var(--bl-ring); }
html[data-theme="dark"] .brand-chip { background: var(--bd-bg); color: var(--bd-fg); border: var(--bd-ring); }

.ptxt {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  min-width: 0;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
}
.pbig {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: -0.02em;
  flex: none;
  white-space: nowrap;
  color: var(--ink);
}
.pst {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.primary.l-out .pbig, .primary.l-soon .pbig,
.primary.l-out .pst, .primary.l-soon .pst { color: var(--soon); }
.primary.l-warn .pbig, .primary.l-warn .pst { color: var(--warn); }
.primary.l-balance .pbig { color: var(--bal); }
.primary.l-idle .logo { opacity: 0.55; }
.primary.l-idle .pbig { font-size: 11.5px; font-weight: 700; color: var(--muted); }

.more {
  flex: none;
  height: 28px;
  margin-left: 2px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.more-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 22px;
  min-width: 30px;
  padding: 0 7px;
  border-radius: 999px;
  background: var(--more-bg);
  color: var(--more-ink);
  font-size: 10.5px;
  font-weight: 800;
  white-space: nowrap;
  transition: transform 180ms var(--spring), background-color 160ms ease;
}
.pill-main:hover .more-chip { transform: scale(1.04); }
.more.urgent .more-chip {
  background: var(--soon);
  color: var(--badge-ink);
}

.status-txt {
  flex: none;
  display: inline-flex;
  align-items: center;
  padding: 0 8px;
  height: 28px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chip {
  flex: none;
  height: 28px;
  padding: 0 9px;
  border-radius: 999px;
  overflow: hidden;
  background: var(--chip-bg);
  color: var(--chip-ink);
  font-size: 10.5px;
  font-weight: 700;
  line-height: 1.2;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}
.chip svg { flex: none; }
.chip span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tab[data-chip="full"] .chip { width: 196px; }
.tab[data-chip="code"] .chip { width: 78px; padding: 0 6px; justify-content: center; }
.tab[data-chip="icon"] .chip { width: 28px; padding: 0; justify-content: center; }

.refresh {
  flex: none;
  width: 26px;
  height: 26px;
  margin-left: 2px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  color: var(--muted);
  transition: background-color 160ms ease, color 160ms ease, transform 160ms var(--spring);
}
.refresh svg { transition: transform 240ms var(--spring); }
.refresh:hover { background: var(--hover); color: var(--ink); }
.refresh:hover:not(.spinning) svg { transform: rotate(40deg); }
.refresh:active { transform: scale(0.92); }
.refresh.spinning svg, .foot-refresh.spinning svg { animation: spin 0.75s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* Dimmed (stale) preserves >= 4.5:1 contrast on every text label. */
.tab.stale .logo { opacity: 0.5; }
.tab.stale .primary .pbig,
.tab.stale .primary .pst,
.tab.stale .spend { color: var(--muted); }

/* Compact & tight fallbacks for narrow monitor budgets (matches tab_window.py). */
.tab[data-no-status] .pst { display: none; }
.tab[data-tight] .home { width: 27px; margin-right: 1px; }
.tab[data-tight] .refresh { width: 24px; height: 24px; margin-left: 1px; }
.tab[data-tight] .more-chip { min-width: 26px; padding: 0 5px; font-size: 10px; }

/* ---- Hover-to-peek overview card -------------------------------------- */
.card-wrap { flex: none; padding: 6px 0 0; }
body.up .card-wrap { padding: 0 0 6px; }
.card {
  width: 356px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 13px 14px 11px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  box-shadow: 0 8px 24px rgba(24, 23, 43, 0.16);
  transform-origin: top center;
  transition: transform 140ms var(--spring);
}
body.up .card { transform-origin: bottom center; }
.card.is-entering { animation: cardEnterDown 210ms var(--spring) both; }
body.up .card.is-entering { animation: cardEnterUp 210ms var(--spring) both; }
.card.is-closing {
  transform: translateY(-7px);
  transition: transform 110ms cubic-bezier(0.4, 0, 1, 1);
  pointer-events: none;
}
body.up .card.is-closing { transform: translateY(7px); }
@keyframes cardEnterDown { from { transform: translateY(-9px); } to { transform: translateY(0); } }
@keyframes cardEnterUp { from { transform: translateY(9px); } to { transform: translateY(0); } }
@keyframes rowGlideDown { from { transform: translateY(-5px); } to { transform: translateY(0); } }
@keyframes rowGlideUp { from { transform: translateY(5px); } to { transform: translateY(0); } }
@keyframes barSweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.ch-left { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
.ch-val { font-size: 17px; font-weight: 800; letter-spacing: -0.025em; color: var(--ink); white-space: nowrap; }
.ch-lbl { font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.ch-meta { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.card-err {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  padding: 7px 9px;
  border-radius: 9px;
  background: var(--chip-bg);
  color: var(--chip-ink);
  font-size: 11px;
  font-weight: 700;
  line-height: 1.35;
}
.card-err svg { flex: none; margin-top: 1px; }

.ov-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}
.ov-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 3px 6px;
  margin: 0 -6px;
  border-radius: 8px;
  transition: background-color 140ms ease;
}
.ov-row:hover { background: var(--hover); }
.card.is-entering .ov-row { animation: rowGlideDown 220ms var(--spring) both; }
body.up .card.is-entering .ov-row { animation: rowGlideUp 220ms var(--spring) both; }
.card.is-entering .ov-row:nth-child(2) { animation-delay: 24ms; }
.card.is-entering .ov-row:nth-child(3) { animation-delay: 48ms; }
.card.is-entering .ov-row:nth-child(4) { animation-delay: 72ms; }
.ov-line { display: flex; align-items: center; gap: 7px; min-width: 0; }
.ov-line .logo { width: 18px; height: 18px; border-radius: 5px; transition: transform 180ms var(--spring); }
.ov-row:hover .logo { transform: scale(1.06); }
.ov-line .logo svg { width: 10px; height: 10px; }
.ov-name {
  flex: 1;
  min-width: 0;
  font-size: 11.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--ink);
}
.ov-name b { font-weight: 700; }
.ov-tag { color: var(--muted); font-weight: 600; }
.ov-stat { font-size: 11.5px; font-weight: 800; white-space: nowrap; flex: none; color: var(--ink); }
.ov-stat.l-out, .ov-stat.l-soon { color: var(--soon); }
.ov-stat.l-warn { color: var(--warn); }
.ov-stat.l-ok { color: var(--ok); }
.ov-stat.l-balance { color: var(--bal); }
.ov-stat.l-idle { color: var(--muted); font-weight: 600; }

.ov-bar { height: 3px; border-radius: 9px; background: var(--track); overflow: hidden; display: block; margin-left: 25px; }
.ov-bar i {
  display: block;
  height: 100%;
  border-radius: 9px;
  background: var(--ok);
  transform-origin: left center;
  transition: width 360ms var(--spring);
}
.card.is-entering .ov-bar i, .card.is-entering .pb i { animation: barSweep 360ms var(--spring) 35ms both; }
.ov-row.l-out .ov-bar i, .ov-row.l-soon .ov-bar i { background: var(--soon); }
.ov-row.l-warn .ov-bar i { background: var(--warn); }

.ov-rest-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: calc(100% + 12px);
  padding: 5px 6px;
  margin: 1px -6px 0;
  border-radius: 8px;
  font-size: 11.5px;
  transition: background-color 150ms ease, transform 140ms var(--spring);
}
.ov-rest-btn:hover { background: var(--hover); }
.ov-rest-btn:active { transform: scale(0.985); }
.ov-rest-lbl { color: var(--muted); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-rest-st {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 800;
  color: var(--bal);
  white-space: nowrap;
  flex: none;
}
.ov-rest-st.is-muted { color: var(--muted); }
.rest-chev {
  flex: none;
  transition: transform 220ms var(--spring);
}
.ov-rest-btn[aria-expanded="true"] .rest-chev { transform: rotate(180deg); }

.ov-rest-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 6px 4px 2px 0;
  border-top: 1px dashed var(--line);
  max-height: 192px;
  overflow-y: auto;
  overflow-x: hidden;
}
.ov-rest-list::-webkit-scrollbar,
.pill-picker-list::-webkit-scrollbar {
  width: 5px;
  height: 0;
}
.ov-rest-list::-webkit-scrollbar-track,
.pill-picker-list::-webkit-scrollbar-track {
  background: transparent;
}
.ov-rest-list::-webkit-scrollbar-thumb,
.pill-picker-list::-webkit-scrollbar-thumb {
  background: var(--track);
  border-radius: 999px;
}
.ov-rest-list::-webkit-scrollbar-thumb:hover,
.pill-picker-list::-webkit-scrollbar-thumb:hover {
  background: var(--muted);
}
.ov-rest-list::-webkit-scrollbar-button,
.pill-picker-list::-webkit-scrollbar-button {
  display: none;
  width: 0;
  height: 0;
}
.rest-row {
  flex: none;
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  min-width: 0;
  font-size: 11.5px;
  line-height: 1.3;
  padding: 4px 6px;
  margin: 0;
  border-radius: 7px;
  overflow: hidden;
  transition: background-color 140ms ease;
  animation: rowGlideDown 200ms var(--spring) both;
}
.rest-row:hover { background: var(--hover); }
.rest-row:nth-child(2) { animation-delay: 16ms; }
.rest-row:nth-child(3) { animation-delay: 32ms; }
.rest-row:nth-child(4) { animation-delay: 48ms; }
.rest-row:nth-child(5) { animation-delay: 64ms; }
.rest-row:nth-child(6) { animation-delay: 80ms; }
.rest-row:nth-child(7) { animation-delay: 96ms; }
.rest-row .logo { width: 16px; height: 16px; border-radius: 4px; flex: none; }
.rest-row .logo svg { width: 9px; height: 9px; }
.rest-row b { flex: 1; min-width: 0; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rest-row span { font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; flex: none; }
.rest-row span.l-balance { color: var(--bal); }

/* In-card Pill Display Customizer */
.pill-cfg {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-top: 6px;
  border-top: 1px solid var(--line);
}
.pill-cfg-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: calc(100% + 12px);
  padding: 4px 6px;
  margin: 0 -6px;
  border-radius: 8px;
  font-size: 11px;
  transition: background-color 150ms ease, transform 140ms var(--spring);
}
.pill-cfg-btn:hover { background: var(--hover); }
.pill-cfg-btn:active { transform: scale(0.985); }
.pill-cfg-lbl {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;

}

  display: inline-flex;
  align-items: center;

  overflow: hidden;

}

  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 4px 4px 2px 0;
  max-height: 196px;

  overflow-x: hidden;
}
.pick-row {
  flex: none;
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  min-width: 0;
  padding: 5px 6px;
  border-radius: 7px;
  font-size: 11px;
  line-height: 1.3;

  transition: background-color 140ms ease;
}

.pick-row.is-active { background: var(--spend-bg); }

  width: 16px;
  height: 16px;
  border-radius: 4px;
  flex: none;
  display: inline-flex;

.ph b { display: block; font-size: 12.5px; }
.ph small { display: block; font-size: 11px; color: var(--muted); }
.pw { display: flex; flex-direction: column; gap: 4px; padding-top: 7px; border-top: 1px solid var(--line); }
.pl, .pr { display: flex; justify-content: space-between; gap: 8px; }
.pl { font-size: 11.5px; }
.pl span { font-weight: 600; }
.pr { font-size: 10.5px; color: var(--muted); }
.pb { height: 4px; border-radius: 9px; background: var(--track); overflow: hidden; display: block; }
.pb i {
  display: block;
  height: 100%;
  background: var(--ok);
  border-radius: 9px;
  transform-origin: left center;
  transition: width 360ms var(--spring);
}
.pw.l-out .pb i, .pw.l-soon .pb i { background: var(--soon); }
.pw.l-warn .pb i { background: var(--warn); }
.pw.muted .pl span, .pw.muted .pl b { color: var(--muted); }
.pc { display: flex; gap: 6px; align-items: flex-start; font-size: 11px; font-weight: 700; line-height: 1.35; }
.pc svg { flex: none; margin-top: 1px; }
.pc.soon { color: var(--soon); }
.pc.warn { color: var(--warn); }
.pc.ok { color: var(--bal); font-weight: 600; }
.bal { font-size: 16px; font-weight: 800; color: var(--bal); }
.card-empty { padding-top: 8px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); line-height: 1.4; }

.card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}
.foot-open {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11.5px;
  font-weight: 800;
  color: var(--ok);
  padding: 4px 7px;
  margin-left: -7px;
  border-radius: 7px;
  transition: background-color 150ms ease, color 150ms ease, transform 140ms var(--spring);
}
.foot-open:hover { background: var(--hover); }
.foot-open:active { transform: scale(0.96); }
.open-arrow { display: inline-block; transition: transform 180ms var(--spring); }
.foot-open:hover .open-arrow { transform: translate(2px, -2px); }
.foot-refresh {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--muted);
  padding: 4px 7px;
  margin-right: -7px;
  border-radius: 7px;
  transition: background-color 150ms ease, color 150ms ease, transform 140ms var(--spring);
}
.foot-refresh svg { transition: transform 240ms var(--spring); }
.foot-refresh:hover { background: var(--hover); color: var(--ink); }
.foot-refresh:hover:not(.spinning) svg { transform: rotate(40deg); }
.foot-refresh:active { transform: scale(0.96); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
<body>
<!--__BRAND_SPRITE__-->
<div class="tab" id="tab" role="region" aria-label="BURNRATE corner pill">
  <div class="home" id="home" title="Drag to move · Click to open BURNRATE">
    <span class="brand" aria-hidden="true"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="transform:translate(-1px,1px)"><path d="M7 17 17 7M8 7h9v9"/></svg></span>
    <span class="badge" id="badge" hidden></span>
  </div>
  <button class="pill-main" id="pillMain" type="button" hidden>
    <span class="spend" id="spend" hidden></span>
    <span class="sep" id="sep" hidden aria-hidden="true"></span>
    <span class="primary" id="primary" hidden></span>
    <span class="more" id="more" hidden></span>
    <span class="status-txt" id="statusTxt" hidden></span>
  </button>
  <button class="chip" id="chip" type="button" hidden></button>
  <button class="refresh" id="refresh" type="button" aria-label="Refresh usage now" title="Refresh usage now"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
</div>
<div class="card-wrap" id="cardWrap" hidden><div class="card" id="card" role="dialog" aria-label="BURNRATE overview"></div></div>
<script>
/*__BRAND_JS__*/
(function () {
  "use strict";
  var HIDE_DELAY = 220, SHOW_DELAY = 150, CLOSE_MS = 120;
  var state = null, cardOpen = false, restExpanded = false, pickerExpanded = false;
  var showTimer = 0, hideTimer = 0, closeTimer = 0, enterTimer = 0, spinTimer = 0, rafMeasure = 0, ready = false;
  var lastSig = null, restoring = false, rebuilding = false, refreshing = false;
  var lastRevision = 0;
  var DRAG_PX = 4, press = null, dragging = false, swallowClick = false, lastRing = false;
  var $ = function (id) { return document.getElementById(id); };
  var CHEV_SVG = '<svg class="rest-chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  var PIN_SVG = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>';
  var AUTO_SVG = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>';

  function esc(value) {
    return String(value === null || value === undefined ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function api() { return window.pywebview && window.pywebview.api ? window.pywebview.api : null; }
  function call(name) {
    var a = api();
    if (!a || typeof a[name] !== "function") return Promise.resolve(null);
    var args = Array.prototype.slice.call(arguments, 1);
    try { return Promise.resolve(a[name].apply(a, args)).catch(function () { return null; }); }
    catch (e) { return Promise.resolve(null); }
  }
  function logo(key) {
    return typeof logoHtml === "function" ? logoHtml(key, "logo", false) : '<span class="logo"></span>';
  }
  var WARN = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
  var CHECK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';
  var REFRESH_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>';

  function setRefreshing(on) {
    refreshing = !!on;
    clearTimeout(spinTimer);
    $("refresh").classList.toggle("spinning", refreshing);
    var fr = document.querySelector("#card [data-refresh]");
    if (fr) {
      fr.classList.toggle("spinning", refreshing);
      var lbl = fr.querySelector("span");
      if (lbl) lbl.textContent = refreshing ? "Refreshing\u2026" : "Refresh now";
    }
    if (refreshing) {
      spinTimer = setTimeout(function () { setRefreshing(false); }, 8000);
    }
  }
  function triggerRefresh() {
    setRefreshing(true);
    call("refresh_now");
  }

  /* Focus preservation across live refreshes */
  function focusToken() {
    var el = document.activeElement;
    if (!el || el === document.body) return null;
    if (el.id === "pillMain" || el.id === "chip" || el.id === "refresh") return { k: el.id };
    if (el.hasAttribute && el.hasAttribute("data-open")) return { k: "card-open" };
    if (el.hasAttribute && el.hasAttribute("data-refresh")) return { k: "card-refresh" };
    if (el.hasAttribute && el.hasAttribute("data-toggle-rest")) return { k: "card-rest" };
    if (el.hasAttribute && el.hasAttribute("data-toggle-picker")) return { k: "card-picker" };
    return null;
  }
  function restoreFocus(token) {
    if (!token) return;
    var target = null;
    if (token.k === "card-open") target = document.querySelector("#card [data-open]");
    else if (token.k === "card-refresh") target = document.querySelector("#card [data-refresh]");
    else if (token.k === "card-rest") target = document.querySelector("#card [data-toggle-rest]");
    else if (token.k === "card-picker") target = document.querySelector("#card [data-toggle-picker]");
    else target = $(token.k);
    if (!target || target.hidden) return;
    restoring = true;
    try { target.focus({ preventScroll: true }); } finally { restoring = false; }
  }

  /* Keep pill headlines strictly inside their slot even under extreme text */
  function fitSlot(el, container, minPx) {
    if (!el || !container || container.clientWidth <= 0) return;
    var size = parseFloat(getComputedStyle(el).fontSize) || 13;
    var full = el.textContent;
    el.style.fontSize = "";
    while (el.scrollWidth > container.clientWidth && size > minPx) {
      size -= 0.5;
      el.style.fontSize = size + "px";
    }
    var text = full;
    while (el.scrollWidth > container.clientWidth && text.length > 2) {
      text = text.slice(0, -2).replace(/\s+$/, "") + "\u2026";
      el.textContent = text;
    }
  }
  function fitPillText() {
    var spend = $("spend");
    if (!spend.hidden) fitSlot(spend, spend, 9.5);
    var primary = $("primary");
    if (!primary.hidden) {
      var big = primary.querySelector(".pbig");
      var ptxt = primary.querySelector(".ptxt");
      if (big && ptxt) fitSlot(big, ptxt, 9.5);
    }
  }

  function pillAria(next) {
    var parts = [];
    if (next.spend && next.spend.aria) parts.push(next.spend.aria);
    if (next.primary && next.primary.aria) parts.push(next.primary.aria);
    if (next.more && next.more.count) {
      parts.push("+" + next.more.count + (next.more.urgentCount ? " more including " + next.more.urgentCount + " urgent" : " more providers"));
    }
    if (next.state === "loading") parts.push("Loading usage");
    else if (next.state === "empty") parts.push("No limits yet, click to open BURNRATE");
    return parts.join(" · ") || "Open BURNRATE";
  }

  function render(next) {
    var display = Object.assign({}, next);
    delete display.revision;
    var sig = JSON.stringify(display);
    if (sig === lastSig) { state = next; return; }
    lastSig = sig;
    var token = focusToken();
    rebuilding = true;
    state = next;
    if (window.burnrateTabTheme) window.burnrateTabTheme.setDark(!!next.dark);

    var tab = $("tab");
    var layout = next.layout || {};
    var mode = layout.mode || {};
    tab.style.width = Number(layout.width || 260) + "px";
    tab.classList.toggle("stale", !!next.stale);
    tab.dataset.chip = mode.chip || "none";
    if (mode.showStatus === false) tab.dataset.noStatus = "1"; else delete tab.dataset.noStatus;
    if (mode.tight) tab.dataset.tight = "1"; else delete tab.dataset.tight;

    var badge = $("badge");
    badge.hidden = !(next.urgentCount > 0);
    badge.textContent = next.urgentCount || "";
    badge.setAttribute("aria-label", next.urgentCount + " about to run out");

    var pillMain = $("pillMain");
    var spendEl = $("spend");
    var sepEl = $("sep");
    var primaryEl = $("primary");
    var moreEl = $("more");
    var statusTxt = $("statusTxt");

    var showPillMain = next.state !== "error";
    pillMain.hidden = !showPillMain;
    if (showPillMain) {
      var label = pillAria(next);
      pillMain.setAttribute("aria-label", label);
      pillMain.title = label;

      var showSpend = !!(mode.showSpend && next.spend && next.spend.compact);
      if (showSpend) {
        spendEl.hidden = false;
        spendEl.style.width = Number(layout.spendWidth || 46) + "px";
        spendEl.textContent = next.spend.compact;
      } else {
        spendEl.hidden = true;
        spendEl.textContent = "";
      }

      var showPrimary = next.state === "ready" && !!next.primary;
      var showStatusText = next.state === "loading" || next.state === "empty";
      sepEl.hidden = !(showSpend && (showPrimary || next.state === "empty"));

      if (showPrimary) {
        var p = next.primary;
        primaryEl.hidden = false;
        primaryEl.className = "primary l-" + esc(p.level);
        primaryEl.style.width = Number(layout.primaryWidth || 100) + "px";
        var stHtml = (mode.showStatus !== false && p.shortStatus) ? '<span class="pst">' + esc(p.shortStatus) + "</span>" : "";
        primaryEl.innerHTML = logo(p.key) + '<span class="ptxt"><b class="pbig">' + esc(p.pillBig || p.big) + "</b>" + stHtml + "</span>";
      } else {
        primaryEl.hidden = true;
        primaryEl.innerHTML = "";
      }

      if (showPrimary && next.more && next.more.count > 0) {
        moreEl.hidden = false;
        moreEl.style.width = Number(layout.moreWidth || 34) + "px";
        moreEl.classList.toggle("urgent", next.more.severity === "soon");
        moreEl.innerHTML = '<span class="more-chip">+' + esc(next.more.count) + "</span>";
      } else {
        moreEl.hidden = true;
        moreEl.innerHTML = "";
      }

      if (showStatusText) {
        statusTxt.hidden = false;
        statusTxt.style.width = next.state === "loading" ? "92px" : (mode.compact ? "84px" : "116px");
        statusTxt.textContent = next.state === "loading" ? "Loading\u2026" : (mode.compact ? "No limits" : "No limits yet");
      } else {
        statusTxt.hidden = true;
        statusTxt.textContent = "";
      }
    }

    var chip = $("chip");
    if (next.error) {
      chip.hidden = false;
      chip.title = next.error.message ? next.error.text + " \u2014 " + next.error.message : next.error.text;
      chip.setAttribute("aria-label", next.error.text);
      var chipText = mode.chip === "icon" ? "" : mode.chip === "code" ? (next.error.code || "") : next.error.text;
      chip.innerHTML = WARN + (chipText ? "<span>" + esc(chipText) + "</span>" : "");
    } else {
      chip.hidden = true;
      chip.innerHTML = "";
    }

    if (cardOpen) {
      if (canShowCard(next)) fillCard(false);
      else hideCard(true);
    }
    fitPillText();
    restoreFocus(token);
    rebuilding = false;
  }

  /* ---- Hover-to-peek overview card ------------------------------------ */
  function canShowCard(s) {
    return !!(s && s.state !== "loading");
  }
  function windowHtml(r) {
    if (r.muted) {
      return '<div class="pw muted"><div class="pl"><span>' + esc(r.label) + '</span><b>\u2014</b></div><div class="pr"><span>' + esc(r.note) + "</span></div></div>";
    }
    var pace = "";
    if (r.pace) {
      pace = '<p class="pc ' + esc(r.pace.level) + '">' + (r.pace.level === "ok" ? CHECK : WARN) + "<span>" + esc(r.pace.text) + "</span></p>";
    }
    return '<div class="pw l-' + esc(r.level) + '"><div class="pl"><span>' + esc(r.label) + "</span><b>" + esc(r.leftPct) + '% left</b></div>' +
      '<span class="pb"><i style="width:' + Number(r.leftPct) + '%"></i></span>' +
      '<div class="pr"><span>' + esc(r.resets) + "</span><span>" + esc(r.usedPct) + "% used</span></div>" + pace + "</div>";
  }
  function overviewRowHtml(item) {
    var tag = item.windowTag ? ' <span class="ov-tag">(' + esc(item.windowTag) + ")</span>" : "";
    var bar = (!item.muted && item.level !== "balance")
      ? '<span class="ov-bar"><i style="width:' + Number(item.fuel || 0) + '%"></i></span>'
      : "";
    return '<div class="ov-row l-' + esc(item.level) + '">' +
      '<div class="ov-line">' + logo(item.key) +
      '<span class="ov-name"><b>' + esc(item.title) + "</b>" + tag + "</span>" +
      '<span class="ov-stat l-' + esc(item.level) + '">' + esc(item.cardStatus || item.status) + "</span></div>" +
      bar + "</div>";
  }
  function cardHtml(s) {
    var head = "";
    if (s.spend && s.spend.exact) {
      head = '<div class="card-head"><div class="ch-left"><span class="ch-val">' + esc(s.spend.exact) +
        '</span><span class="ch-lbl">today</span></div>' +
        (s.spend.meta ? '<span class="ch-meta">' + esc(s.spend.meta) + "</span>" : "") + "</div>";
    } else {
      head = '<div class="card-head"><div class="ch-left"><span class="ch-val">BURNRATE</span></div>' +
        '<span class="ch-meta">Usage limits</span></div>';
    }

    var errBanner = "";
    if (s.error) {
      var detail = s.error.message && s.error.message !== s.error.text ? s.error.message : s.error.text;
      errBanner = '<div class="card-err">' + WARN + "<span>" + esc(s.error.code ? s.error.text : detail) + "</span></div>";
    }

    var body = "";
    var ov = s.overview || {};
    var hi = ov.highlighted || [];
    var rest = ov.rest || [];
    if (ov.single && hi.length === 1) {
      var seg = hi[0];
      var c = seg.card || {};
      var rows = (c.rows || []).map(windowHtml).join("");
      if (c.balance) {
        rows += '<div class="pw"><div class="pl"><span>Balance</span><span class="bal">$' + esc(Number(c.balance.amount || 0).toFixed(2)) +
          '</span></div><div class="pr"><span>' + esc(c.balance.summary) + "</span></div></div>";
      }
      if (!rows) rows = '<div class="pw"><div class="pr"><span>' + esc(seg.status || c.summary || "Awaiting reading") + "</span></div></div>";
      body = '<div class="ph">' + logo(seg.key) + "<div><b>" + esc(seg.title) + "</b><small>" + esc(seg.plan) + "</small></div></div>" + rows;
    } else if (hi.length > 0) {
      var listHtml = hi.map(overviewRowHtml).join("");
      var restHtml = "";
      if (rest.length > 0) {
        var mutedCls = ov.restStatus === "Idle" ? " is-muted" : "";
        restHtml = '<button class="ov-rest-btn" type="button" data-toggle-rest aria-expanded="' + (restExpanded ? "true" : "false") + '">' +
          '<span class="ov-rest-lbl">' + esc(ov.restSummary) + '</span>' +
          '<span class="ov-rest-st' + mutedCls + '">' + esc(ov.restStatus) + CHEV_SVG + "</span></button>";
        if (restExpanded) {
          restHtml += '<div class="ov-rest-list">' + rest.map(function (it) {
            return '<div class="rest-row">' + logo(it.key) + "<b>" + esc(it.title) + '</b><span class="l-' + esc(it.level) + '">' + esc(it.text) + "</span></div>";
          }).join("") + "</div>";
        }
      }
      body = '<div class="ov-list">' + listHtml + restHtml + "</div>";
    } else if (s.state === "empty") {
      body = '<div class="card-empty">No provider limits connected yet. Open BURNRATE to add a source.</div>';
    }

    var pickerHtml = "";
    var opts = s.pillOptions || [];
    if (opts.length > 0 && s.state === "ready") {
      var activeId = s.pillLimit || "";
      var pillLbl = s.pillLabel || "Auto";
      var pinCls = s.pillPinned ? " is-pinned" : "";
      pickerHtml = '<div class="pill-cfg">' +
        '<button class="pill-cfg-btn" type="button" data-toggle-picker aria-expanded="' + (pickerExpanded ? "true" : "false") + '">' +
          '<span class="pill-cfg-lbl">' + PIN_SVG + "<span>Pill limit</span></span>" +
          '<span class="pill-cfg-val' + pinCls + '"><span>' + esc(pillLbl) + "</span>" + CHEV_SVG + "</span>" +
        "</button>";
      if (pickerExpanded) {
        var autoActive = !activeId;
        var itemsHtml = '<button class="pick-row' + (autoActive ? " is-active" : "") + '" type="button" data-pick-limit="">' +
          '<span class="pick-auto-ico" aria-hidden="true">' + AUTO_SVG + "</span>" +
          '<span class="pick-name"><b>Auto</b> <span class="ov-tag">(most urgent)</span></span>' +
          '<span class="pick-check">' + (autoActive ? CHECK : "") + "</span></button>";
        itemsHtml += opts.map(function (o) {
          var isAct = activeId === o.id;
          return '<button class="pick-row' + (isAct ? " is-active" : "") + '" type="button" data-pick-limit="' + esc(o.id) + '">' +
            logo(o.key) +
            '<span class="pick-name"><b>' + esc(o.title) + '</b> <span class="ov-tag">(' + esc(o.windowLabel) + ")</span></span>" +
            '<span class="pick-stat l-' + esc(o.level) + '">' + esc(o.stat) + "</span>" +
            '<span class="pick-check">' + (isAct ? CHECK : "") + "</span></button>";
        }).join("");
        pickerHtml += '<div class="pill-picker-list">' + itemsHtml + "</div>";
      }
      pickerHtml += "</div>";
    }

    var spinCls = refreshing ? " spinning" : "";
    var refLabel = refreshing ? "Refreshing\u2026" : "Refresh now";
    var foot = '<div class="card-foot">' +
      '<button class="foot-open" type="button" data-open>Open full BURNRATE <span class="open-arrow" aria-hidden="true">\u2197</span></button>' +
      '<button class="foot-refresh' + spinCls + '" type="button" data-refresh>' + REFRESH_SVG + "<span>" + esc(refLabel) + "</span></button>" +
      "</div>";
    return head + errBanner + body + pickerHtml + foot;
  }

  function fillCard(animateEnter) {
    if (!state || !canShowCard(state)) return;
    var card = $("card");
    var html = cardHtml(state);
    if (card.dataset.html !== html) {
      var token = focusToken();
      rebuilding = true;
      card.innerHTML = html;
      card.dataset.html = html;
      restoreFocus(token);
      rebuilding = false;
    }
    clearTimeout(closeTimer);
    if (rafMeasure) { cancelAnimationFrame(rafMeasure); rafMeasure = 0; }
    card.classList.remove("is-closing");
    $("cardWrap").hidden = false;
    var layout = state.layout || {};
    var cardW = layout.cardWidth || 356;
    card.style.width = cardW + "px";
    var pillW = layout.width || cardW;
    var cardLeft = pillW > cardW ? Math.max(0, Math.round((pillW - cardW) / 2)) : 0;
    card.style.marginLeft = cardLeft + "px";
    var measureH = function () {
      return Math.ceil(card.getBoundingClientRect().height || card.offsetHeight) + 1;
    };
    var cardH = measureH();
    var width = Math.max(pillW, cardLeft + cardW);
    var height = (layout.height || 40) + (layout.cardGap || 6) + cardH;
    var triggerEnter = function () {
      if (!animateEnter || !cardOpen) return;
      clearTimeout(enterTimer);
      card.classList.remove("is-entering");
      void card.offsetWidth;
      card.classList.add("is-entering");
      enterTimer = setTimeout(function () { card.classList.remove("is-entering"); }, 420);
    };
    call("expand", width, height, cardLeft, cardW, cardH).then(function (res) {
      document.body.classList.toggle("up", !!(res && res.up));
      $("tab").style.marginLeft = (res && res.stripX ? Number(res.stripX) : 0) + "px";
      triggerEnter();
      rafMeasure = requestAnimationFrame(function () {
        rafMeasure = 0;
        if (!cardOpen || $("cardWrap").hidden) return;
        var settledH = measureH();
        if (Math.abs(settledH - cardH) >= 1) {
          var nextH = (layout.height || 40) + (layout.cardGap || 6) + settledH;
          call("expand", width, nextH, cardLeft, cardW, settledH);
        }
      });
    });
  }

  function showCard() {
    if (!canShowCard(state)) return;
    var wasClosed = !cardOpen || $("card").classList.contains("is-closing");
    clearTimeout(closeTimer);
    clearTimeout(hideTimer);
    cardOpen = true;
    $("pillMain").classList.add("on");
    fillCard(wasClosed);
  }
  function finishHideDom() {
    clearTimeout(closeTimer);
    clearTimeout(enterTimer);
    if (rafMeasure) { cancelAnimationFrame(rafMeasure); rafMeasure = 0; }
    var card = $("card");
    card.classList.remove("is-closing", "is-entering");
    card.dataset.html = "";
    $("cardWrap").hidden = true;
    $("tab").style.marginLeft = "";
    document.body.classList.remove("up");
    restExpanded = false;
    pickerExpanded = false;
  }
  function hideCard(instant) {
    clearTimeout(showTimer);
    clearTimeout(hideTimer);
    if (!cardOpen && $("cardWrap").hidden) return;
    cardOpen = false;
    $("pillMain").classList.remove("on");
    if (instant !== false) {
      finishHideDom();
      call("collapse", true);
      return;
    }
    var card = $("card");
    card.classList.remove("is-entering");
    card.classList.add("is-closing");
    call("collapse", false);
    clearTimeout(closeTimer);
    closeTimer = setTimeout(finishHideDom, CLOSE_MS);
  }
  function scheduleShow() {
    clearTimeout(hideTimer);
    clearTimeout(showTimer);
    clearTimeout(closeTimer);
    if (press || dragging || !canShowCard(state)) return;
    if (cardOpen && !$("card").classList.contains("is-closing")) return;
    showTimer = setTimeout(showCard, $("card").classList.contains("is-closing") ? 0 : SHOW_DELAY);
  }
  function scheduleHide() {
    clearTimeout(showTimer);
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { hideCard(false); }, HIDE_DELAY);
  }

  /* ---- Events ----------------------------------------------------------- */
  $("tab").addEventListener("mouseenter", function () {
    clearTimeout(hideTimer);
    if ($("card").classList.contains("is-closing")) showCard();
  });
  $("home").addEventListener("mouseenter", scheduleShow);
  $("home").addEventListener("click", function () { call("open_full"); });
  $("pillMain").addEventListener("mouseenter", scheduleShow);
  $("pillMain").addEventListener("focus", function () {
    if (restoring || press) return;
    clearTimeout(hideTimer);
    showCard();
  });
  $("pillMain").addEventListener("click", function () { call("open_full"); });
  $("chip").addEventListener("mouseenter", scheduleShow);
  $("chip").addEventListener("focus", function () {
    if (restoring || press) return;
    clearTimeout(hideTimer);
    showCard();
  });
  $("chip").addEventListener("click", function () { call("open_full"); });
  $("refresh").addEventListener("mouseenter", function () {
    if (cardOpen || $("card").classList.contains("is-closing")) {
      clearTimeout(hideTimer);
      if ($("card").classList.contains("is-closing")) showCard();
    }
  });
  $("refresh").addEventListener("click", function (e) {
    e.stopPropagation();
    triggerRefresh();
  });

  $("cardWrap").addEventListener("mouseenter", function () {
    clearTimeout(hideTimer);
    if ($("card").classList.contains("is-closing")) showCard();
  });
  $("cardWrap").addEventListener("click", function (e) {
    if (!e.target.closest) return;
    if (e.target.closest("[data-open]")) { call("open_full"); return; }
    if (e.target.closest("[data-refresh]")) { triggerRefresh(); return; }
    if (e.target.closest("[data-toggle-rest]")) {
      restExpanded = !restExpanded;
      if (restExpanded) pickerExpanded = false;
      fillCard(false);
      return;
    }
    if (e.target.closest("[data-toggle-picker]")) {
      pickerExpanded = !pickerExpanded;
      if (pickerExpanded) restExpanded = false;
      fillCard(false);
      return;
    }
    var pickBtn = e.target.closest("[data-pick-limit]");
    if (pickBtn) {
      var val = pickBtn.getAttribute("data-pick-limit") || "";
      pickerExpanded = false;
      call("set_pill_limit", val || null).then(function (res) {
        if (res && res.state) applyUpdate(res.state);
        else fillCard(false);
      });
    }
  });
  document.documentElement.addEventListener("mouseleave", scheduleHide);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && (cardOpen || !$("cardWrap").hidden)) { hideCard(true); }
  });
  document.addEventListener("focusout", function (e) {
    if (rebuilding) return;
    if (e.relatedTarget === null || !document.body.contains(e.relatedTarget)) scheduleHide();
  });

  /* Drag from anywhere on the pill (> 4px starts native drag, closes hover card,
     and swallows trailing click so a drag never triggers open_full or refresh). */
  $("tab").addEventListener("mousedown", function (e) {
    if (e.button !== 0) return;
    press = { x: e.clientX, y: e.clientY };
    dragging = false;
    swallowClick = false;
    call("press");
  });
  document.addEventListener("mousemove", function (e) {
    if (!press) return;
    if (e.buttons === 0) { press = null; dragging = false; return; }
    if (dragging) return;
    if (Math.abs(e.clientX - press.x) <= DRAG_PX && Math.abs(e.clientY - press.y) <= DRAG_PX) return;
    dragging = true;
    swallowClick = true;
    clearTimeout(showTimer);
    clearTimeout(hideTimer);
    hideCard(true);
    call("begin_drag");
  });
  document.addEventListener("mouseup", function () { press = null; dragging = false; });
  document.addEventListener("click", function (e) {
    if (swallowClick && e.detail > 0) {
      swallowClick = false;
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);

  /* Keep Auto-fade opaque while a keyboard focus ring is inside the pill or card. */
  function reportFocus() {
    var el = document.activeElement;
    var ring = !!(el && el !== document.body && el.matches && el.matches(":focus-visible"));
    if (ring !== lastRing) { lastRing = ring; call("set_focus", ring); }
  }
  document.addEventListener("focusin", reportFocus);
  document.addEventListener("focusout", function () { setTimeout(reportFocus, 0); });
  window.addEventListener("blur", function () { setTimeout(reportFocus, 0); });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  function applyUpdate(next) {
    if (!next) return;
    if (Number.isSafeInteger(next.revision) && next.revision > 0) {
      if (next.revision <= lastRevision) return;
      lastRevision = next.revision;
    } else if (lastRevision) {
      return;
    }
    if (refreshing) setRefreshing(false);
    render(next);
  }
  function poll() { call("get_state").then(applyUpdate); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (state) { lastSig = null; render(state); } });
  window.burnrateTab = { update: applyUpdate, show: showCard, hide: hideCard, get state() { return state; } };
  window.addEventListener("pywebviewready", function () { ready = true; poll(); });
  setInterval(function () { if (ready) poll(); }, 20000);
  if (api()) { ready = true; poll(); }
})();
</script>
</body>
</html>
