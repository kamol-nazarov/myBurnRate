[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "burnrate"
version = "0.5.6"
description = "A compact native AI usage tracker with API-equivalent pricing and multi-computer sync."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "BURNRATE contributors" }]
keywords = ["ai", "claude-code", "codex", "opencode", "token-usage", "cost", "quota", "hud", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "fastapi>=0.116,<1",
  "starlette>=1.3.1,<2",
  "uvicorn>=0.35,<1",
  "APScheduler>=3.11,<4",
  "PyYAML>=6.0,<7",
  "python-dotenv>=1.1,<2",
  "httpx>=0.28,<1",
  "certifi>=2026.10.23",
  "tzdata>=2024.1",
  "tzlocal>=3.0",
  "keyring>=25,<26",
  "pywebview>=5.0,<7; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.6",
  "httpx>=0.28,<1",
  "pip-audit==2.10.1",
  "hatchling==1.33.0",
]
build = [
  "pyinstaller==6.22.3",
  "hatchling==1.33.0",
  "build==1.6.1",
]

[project.scripts]
burnrate = "spend_app.cli:main"

[tool.hatch.build.targets.sdist]
include = [
  "spend_app/**",
  "spend_web/**",
  "frontend_src/**",
  "scripts/optimize-assets.cjs",
  "scripts/asset-tools/package*.json",
  "pricing/**",
  "tests_spend/**",
  "README.md",
  "NOTICE",
  "LICENSE",
  "docs/**",
  "pyproject.toml",
]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
  "src-tauri/**",
  "apps/**",
  "web/**",
  "config/**",
  "dashboards/**",
  "provisioning/**",
  "exporters/**",
]

[tool.hatch.build.targets.sdist.force-include]
"src-tauri/icons/32x32.png" = "src-tauri/icons/32x32.png"
"src-tauri/icons/icon.ico" = "src-tauri/icons/icon.ico"

[tool.hatch.build.targets.wheel]
packages = ["spend_app", "spend_web"]

[tool.hatch.build.targets.wheel.force-include]
"pricing" = "pricing"
"NOTICE" = "burnrate-notices/NOTICE"
"src-tauri/icons/32x32.png" = "burnrate-assets/32x32.png"
"src-tauri/icons/icon.ico" = "burnrate-assets/burnrate.ico"
