# Tailnet-only BURNRATE hub with Caddy reverse proxy (see docs/self-hosting.md).
#
# A hub MUST be reachable on your tailnet (or private network) ONLY — never expose
# it on the public Internet. Use a one-time setup token to create the first
# owner from a desktop, or create the account locally on the hub.
#
# Create the owner account immediately after starting the hub.
#
#   BURNRATE_TAILNET_IP=100.x.y.z \
#   BURNRATE_DOMAIN=burnrate.tailnet.ts.net \
#   BURNRATE_ACCESS_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" \
#   docker compose up -d

services:
  # Refuse to publish ports on empty, wildcard (0.0.0.0 / ::), public, or
  # hostname targets unless BURNRATE_HUB_ALLOW_PUBLIC=1 is explicitly set.
  publish-check:
    image: ${BURNRATE_HUB_IMAGE:-ghcr.io/kamol-nazarov/myburnrate-hub:0.6.12-rc.35@sha256:7fbd502e9df659dfd6ba1a1785aeb47b1adcc3c29562535faabfc67f90edcce2}
    restart: "no"
    environment:
      BURNRATE_TAILNET_IP: ${BURNRATE_TAILNET_IP:?Set BURNRATE_TAILNET_IP to this machine's Tailscale IP (e.g. 100.x.y.z)}
      BURNRATE_HUB_ALLOW_PUBLIC: ${BURNRATE_HUB_ALLOW_PUBLIC:-0}
    command: ["sh", "-c", "exec python -m spend_app.exposure check-publish \"$BURNRATE_TAILNET_IP\""]

  hub:
    # The v0.6.12 tag promotes this candidate digest to the 0.6.12 image.
    image: ${BURNRATE_HUB_IMAGE:-ghcr.io/kamol-nazarov/myburnrate-hub:0.6.12-rc.35@sha256:7fbd502e9df659dfd6ba1a1785aeb47b1adcc3c29562535faabfc67f90edcce2}
    restart: unless-stopped
    depends_on:
      publish-check:
        condition: service_completed_successfully
    environment:
      BURNRATE_CENTRAL_SERVER: "1"
      BURNRATE_SUMMARY_PREWARM: "0"
      BURNRATE_DATA_ROOT: /data
      # Required: the hub refuses anonymous API access. Generate a long random value.
      BURNRATE_ACCESS_TOKEN: ${BURNRATE_ACCESS_TOKEN:?Set BURNRATE_ACCESS_TOKEN to a long random value}
      BURNRATE_SETUP_TOKEN: ${BURNRATE_SETUP_TOKEN:-}
      # The tailnet hostname Caddy forwards, so the Host guard accepts it.
      BURNRATE_ALLOWED_HOSTS: ${BURNRATE_DOMAIN:?Set BURNRATE_DOMAIN to the hub's tailnet name}
      BURNRATE_ALLOWED_ORIGINS: https://${BURNRATE_DOMAIN}
      # Trust X-Forwarded-For / X-Forwarded-Proto only from Caddy on loopback so
      # login and registration throttling uses the real client IP behind Caddy.
      BURNRATE_TRUSTED_PROXIES: ${BURNRATE_TRUSTED_PROXIES:-127.0.0.1,::1}
    volumes:
      - hub-data:/data
    # Caddy shares this container's network, so the hub stays bound to 127.0.0.1
    # and Caddy's ports are published ONLY on the machine's Tailscale IP.
    ports:
      - "${BURNRATE_TAILNET_IP:?Set BURNRATE_TAILNET_IP to this machine's Tailscale IP (e.g. 100.x.y.z)}:443:443"
      - "${BURNRATE_TAILNET_IP:?Set BURNRATE_TAILNET_IP to this machine's Tailscale IP (e.g. 100.x.y.z)}:443:443/udp"

  caddy:
    image: caddy:2.11.9@sha256:4e2425f6009577e7c651010f16679c28f7d12df3e7b1914f941a7a3370746b3c
    restart: unless-stopped
    network_mode: "service:hub"
    depends_on:
      publish-check:
        condition: service_completed_successfully
      hub:
        condition: service_started
    environment:
      BURNRATE_DOMAIN: ${BURNRATE_DOMAIN:?Set BURNRATE_DOMAIN to the hub's tailnet name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  hub-data:
  caddy-data:
  caddy-config:
